apiVersion: v1
kind: Namespace
metadata:
  name: kaloora
  labels:
    name: kaloora
---
apiVersion: v1
kind: LimitRange
metadata:
  name: kaloora-limit-range
  namespace: kaloora
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      type: Container
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: kaloora-quota
  namespace: kaloora
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "4Gi"
    limits.cpu: "8"
    limits.memory: "8Gi"
    pods: "30"

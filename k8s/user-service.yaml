apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: kaloora
  labels:
    app: user-service
  annotations:
    checkov.io/skip1: CKV_K8S_35=Secrets used as env vars
    checkov.io/skip2: CKV_K8S_43=Standard version tag used
    checkov.io/skip3: CKV_K8S_15=Local application images use IfNotPresent
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      imagePullSecrets:
        - name: ecr-secret
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - user-service
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: user-service
          image: 385904685227.dkr.ecr.us-east-1.amazonaws.com/kaloora-eks/user-service:v1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: secret-volume
              mountPath: /etc/secrets
              readOnly: true
          ports:
            - containerPort: 5001
          env:
            - name: PORT
              value: "5001"
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: kaloora-secrets
                  key: postgres-host
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: kaloora-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kaloora-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: kaloora-secrets
                  key: postgres-db
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kaloora-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: secret-volume
          secret:
            secretName: kaloora-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: kaloora
spec:
  ports:
    - port: 5001
      targetPort: 5001
  selector:
    app: user-service

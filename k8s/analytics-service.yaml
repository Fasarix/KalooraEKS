apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: kaloora
  labels:
    app: analytics-service
  annotations:
    checkov.io/skip1: CKV_K8S_35=Secrets used as env vars
    checkov.io/skip2: CKV_K8S_43=Standard version tag used
    checkov.io/skip3: CKV_K8S_15=Local application images use IfNotPresent
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      imagePullSecrets:
        - name: ecr-secret
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - analytics-service
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: analytics-service
          image: 385904685227.dkr.ecr.us-east-1.amazonaws.com/kaloora-eks/analytics-service:v1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: secret-volume
              mountPath: /etc/secrets
              readOnly: true
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              value: "5003"
            - name: HOME
              value: "/tmp"
            - name: TMPDIR
              value: "/tmp"
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: kaloora-secrets
                  key: aws-region
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: kaloora-secrets
                  key: aws-access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kaloora-secrets
                  key: aws-secret-access-key
                  optional: true
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: kaloora-secrets
                  key: redis-host
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kaloora-secrets
                  key: redis-auth-token
                  optional: true
            - name: REDIS_TLS
              value: "true"
            - name: SQS_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: kaloora-secrets
                  key: sqs-queue-url
            - name: DIARY_SERVICE_URL
              value: "http://diary-service:5002"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kaloora-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: secret-volume
          secret:
            secretName: kaloora-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: kaloora
spec:
  ports:
    - port: 5003
      targetPort: 5003
  selector:
    app: analytics-service
